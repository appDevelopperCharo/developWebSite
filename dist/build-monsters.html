<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ビルドモンスターズ | チャロ Games</title>
    <meta name="description" content="モンスター収集とダンジョン探索を楽しむRPG『ビルドモンスターズ』。仲間を増やし、編成を磨いて深層へ進もう。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

  <link rel="stylesheet" crossorigin href="/developWebSite/assets/main-BeUma3TY.css">
</head>
<body class="subpage">
    <header id="header">
        <div class="container container-header">
            <div class="logo">
                <a href="index.html" class="logo-link">
                    <span class="logo-text">CHARO | <span class="accent-text">Develop</span></span>
                </a>
            </div>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">BACK TO HOME</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="game-detail-hero monsters-theme">
            <div class="container">
                <div class="game-flex reverse">
                    <div class="game-visual" data-aos="fade-left">
                        <div class="phone-frame monsters-theme">
                            <img src="assets/build_monsters_main.png" alt="Build Monsters Screen" class="screen-img">
                        </div>
                    </div>
                    <div class="game-info" data-aos="fade-right">
                        <span class="label gold">MONSTER / DUNGEON RPG</span>
                        <div class="title-with-icon">
                            <img src="assets/icon_build_monsters.png" alt="Icon" class="game-icon-large">
                            <h1>ビルドモンスターズ</h1>
                        </div>
                        <p class="game-lead">
                            ダンジョンを探索し、出会ったモンスターを仲間にしながら深層へ進む探索RPG。<br>
                            編成と成長を積み重ねて、自分だけの攻略ルートを作ろう。
                        </p>

                        <div class="features-grid">
                            <div class="feature-item">
                                <span class="feature-icon">👾</span>
                                <h4>仲間集め</h4>
                                <p>モンスターを仲間にして戦力化</p>
                            </div>
                            <div class="feature-item">
                                <span class="feature-icon">🗝️</span>
                                <h4>探索攻略</h4>
                                <p>アイテムと判断で深層を目指す</p>
                            </div>
                        </div>

                        <div class="store-links">
                            <span class="coming-soon-badge">COMING SOON</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer id="footer">
        <div class="container">
            <div class="footer-content">
                <a href="index.html" class="footer-logo">
                    <span class="logo-text">CHARO | <span class="accent-text">Develop</span></span>
                </a>
                <div class="footer-bottom">
                    <p>&copy; 2026 yuuichi sasaki / Charo Games. All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
